<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Snake</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#20345a,#080d1b 70%);color:#f6f9ff}.wrap{width:min(94vw,520px);text-align:center;padding:20px}h1{font-size:clamp(2rem,8vw,3.5rem);margin:0 0 8px;color:#76ffb0;text-shadow:0 0 22px #2fffa966}.stats{display:flex;justify-content:space-between;margin:18px 0;font-weight:700}.stats span{color:#7effbd}.board{position:relative;border:3px solid #4bffae;border-radius:15px;overflow:hidden;box-shadow:0 0 35px #22c98144;background:#101a2d}canvas{display:block;width:100%;aspect-ratio:1;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;gap:15px;background:#07101bd9;padding:20px}.overlay.hidden{display:none}.overlay h2{margin:0;font-size:1.7rem}.overlay p{margin:0;color:#c4d2e3}button{border:0;border-radius:12px;background:#68f9a6;color:#092218;padding:13px 22px;font-size:1rem;font-weight:800;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.96)}.controls{display:grid;grid-template-columns:repeat(3,62px);justify-content:center;gap:8px;margin:20px auto 12px}.controls button{padding:14px 0;background:#263b53;color:white}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.hint{color:#9baec6;font-size:.85rem}#pause{background:#304763;color:white;margin-top:4px}
</style></head><body><main class="wrap"><h1>🐍 NEON SNAKE</h1><div class="stats"><div>Score : <span id="score">0</span></div><div>Record : <span id="best">0</span></div></div><div class="board"><canvas id="game" width="400" height="400" aria-label="Plateau du jeu Snake"></canvas><div class="overlay" id="overlay"><h2 id="message">Prêt à jouer ?</h2><p id="subtitle">Mange les pommes et évite les collisions !</p><button id="start">Jouer ▶</button></div></div><div class="controls"><button class="up" data-dir="up" aria-label="Haut">▲</button><button class="left" data-dir="left" aria-label="Gauche">◀</button><button class="down" data-dir="down" aria-label="Bas">▼</button><button class="right" data-dir="right" aria-label="Droite">▶</button></div><button id="pause">Pause ⏸</button><p class="hint">Flèches du clavier, ZQSD, boutons ou glissement du doigt</p></main><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),message=document.querySelector('#message'),subtitle=document.querySelector('#subtitle'),startBtn=document.querySelector('#start'),pauseBtn=document.querySelector('#pause');const N=20,C=20;let snake,apple,dir,nextDir,score=0,best=0,timer=null,running=false,paused=false,turned=false;try{best=Number(localStorage.getItem('neon-snake-best'))||0}catch{}bestEl.textContent=best;
function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};nextDir={...dir};score=0;scoreEl.textContent=0;apple=spawn();turned=false;draw()}
function spawn(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});return free.length?free[Math.floor(Math.random()*free.length)]:null}
function draw(){ctx.fillStyle='#101a2d';ctx.fillRect(0,0,400,400);ctx.strokeStyle='#1c2b3d';ctx.lineWidth=.6;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,400);ctx.moveTo(0,i*C);ctx.lineTo(400,i*C);ctx.stroke()}if(apple){ctx.fillStyle='#ff5e7b';ctx.beginPath();ctx.arc(apple.x*C+10,apple.y*C+10,7.5,0,Math.PI*2);ctx.fill()}snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#b3ffd0':'#51e99a';ctx.beginPath();ctx.roundRect(s.x*C+1.5,s.y*C+1.5,17,17,5);ctx.fill()});if(snake.length){const h=snake[0];ctx.fillStyle='#103a2b';const cx=h.x*C+10,cy=h.y*C+10;for(const side of [-1,1]){ctx.beginPath();ctx.arc(cx+(dir.y?side*4:dir.x*4),cy+(dir.x?side*4:dir.y*4),1.6,0,Math.PI*2);ctx.fill()}}}
function stop(title,sub){running=false;clearInterval(timer);timer=null;message.textContent=title;subtitle.textContent=sub;startBtn.textContent='Rejouer ↻';overlay.classList.remove('hidden');pauseBtn.textContent='Pause ⏸'}
function tick(){dir=nextDir;turned=false;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eating=apple&&head.x===apple.x&&head.y===apple.y;const body=eating?snake:snake.slice(0,-1);if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(s=>s.x===head.x&&s.y===head.y)){stop('Game Over 💀',`Tu as marqué ${score} point${score>1?'s':''} !`);return}snake.unshift(head);if(eating){score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neon-snake-best',best)}catch{}}apple=spawn();if(!apple){draw();stop('Bravo ! 🏆','Tu as rempli tout le plateau !');return}clearInterval(timer);timer=setInterval(tick,Math.max(65,145-Math.floor(score/50)*7))}else snake.pop();draw()}
function start(){clearInterval(timer);reset();running=true;paused=false;overlay.classList.add('hidden');pauseBtn.textContent='Pause ⏸';timer=setInterval(tick,145)}
function pause(){if(!running)return;paused=!paused;if(paused){clearInterval(timer);message.textContent='En pause ⏸';subtitle.textContent='Appuie pour reprendre';startBtn.textContent='Reprendre ▶';overlay.classList.remove('hidden');pauseBtn.textContent='Reprendre ▶'}else{overlay.classList.add('hidden');pauseBtn.textContent='Pause ⏸';timer=setInterval(tick,Math.max(65,145-Math.floor(score/50)*7))}}
function change(which){const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const d=dirs[which];if(!d||!running||paused||turned||d.x===-dir.x&&d.y===-dir.y)return;nextDir=d;turned=true}
startBtn.addEventListener('click',()=>{if(running&&paused)pause();else start()});pauseBtn.addEventListener('click',pause);document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>change(b.dataset.dir)));document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'up',w:'up',s:'down',q:'left',a:'left',d:'right'};if(map[e.key]){e.preventDefault();change(map[e.key])}else if(e.code==='Space'){e.preventDefault();pause()}});let touch=null;canvas.addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});canvas.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18)change(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');touch=null},{passive:true});reset();
</script></body></html>
